name: Weekly ranks
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-ranks.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "agent-rank-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ranks.json
          git diff --cached --quiet || git commit -m "chore: weekly agent ranks"
          git push