name: Weekly AI Agent Rankings

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: env

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Research, Sync History, and Push Data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          # 1. Generate rankings
          npm run research

          # 2. Configure bot identity
          git config user.name "agent-market-intelligence[bot]"
          git config user.email "agent-market-intelligence[bot]@users.noreply.github.com"

          # 3. Configure authenticated GitHub remote
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # 4. Stage generated rankings
          git add public/data/rankings.json

          # 5. Commit if rankings changed
          git diff --cached --quiet || git commit -m "Weekly rankings $(date -u +%Y-%m-%d)"

          # 6. Update local branch from GitHub
          git pull --rebase origin main

          # 7. Push generated rankings
          git push origin main