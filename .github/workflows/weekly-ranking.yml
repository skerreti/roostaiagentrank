name: Weekly AI Agent Rankings

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ADD THIS LINE to tell GitHub to read from your "env" Environment
    environment: env  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Weekly research and ranking
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run research

      - name: Commit ranking
        run: |
          git config user.name "agent-market-intelligence[bot]"
          git config user.email "agent-market-intelligence[bot]@users.noreply.github.com"
          
          # 1. Stage the file
          git add public/data/rankings.json
          
          # 2. Commit only if there are actual updates
          git diff --cached --quiet || git commit -m "Weekly rankings $(date -u +%Y-%m-%d)"
          
          # 3. Pull with an explicit rebase target to sync up-to-the-second remote changes
          git pull --rebase origin main
          
          # 4. Push specifying the remote and branch explicitly
          git push origin main